# https://artifacthub.io/packages/helm/bitnami/mlflow
mlflow:
  fullnameOverride: mlflow
  postgresql:
    enabled: false
  externalDatabase:
    dialectDriver: "postgresql"
    host: postgresql
    port: 5432
    database: mlflow
    user: postgres
    password: postgres
  tracking:
    service:
      type: NodePort
      nodePorts:
        http: "30402"
    auth:
      enabled: false
    persistence:
      size: 1Gi
  minio:
    auth:
      rootUser: myminioadmin
      rootPassword: myminioadminpassword
    service:
      type: NodePort
    persistence:
      enabled: true
      size: 5Gi

# https://grafana.github.io/helm-charts
loki-stack:
  prometheus:
    enabled: true
    server:
      fullnameOverride: prometheus-server
      service:
        type: NodePort
        nodePort: 30403
      persistentVolume:
        enabled: true
        size: 1Gi
    alertmanager:
      enabled: false
    kube-state-metrics:
      fullnameOverride: kube-state-metrics
    prometheus-node-exporter:
      fullnameOverride: node-exporter
    prometheus-pushgateway:
      fullnameOverride: pushgateway
    extraScrapeConfigs: |
      - job_name: api-server
        scrape_interval: 5s
        static_configs:
          - targets:
            - api-server.mlops-platform.svc.cluster.local:80
  grafana:
    enabled: true
    fullnameOverride: grafana
    persistence:
      enabled: true
      size: 1Gi
    service:
      type: NodePort
      nodePort: 30404
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - uid: prometheus
            orgId: 1
            name: Prometheus
            type: prometheus
            typeName: Prometheus
            access: proxy
            url: http://prometheus-server:80
            password: ""
            user: ""
            database: ""
            basicAuth: false
            isDefault: true
            jsonData:
              # Prometheus 지표 안에 포함된 exemplar.TraceID를 어느 트레이싱 시스템에 연결할지 지정
              exemplarTraceIdDestinations:
                - datasourceUid: tempo
                  name: TraceID
              httpMethod: POST
            readOnly: false
            editable: true
          - uid: tempo
            orgId: 1
            name: Tempo
            type: tempo
            typeName: Tempo
            access: proxy
            url: http://tempo:3100
            password: ""
            user: ""
            database: ""
            basicAuth: false
            isDefault: false
            jsonData:
              nodeGraph:
                enabled: true
              search:
                hide: false
              lokiSearch:
                datasourceUid: loki
              # Traces → Logs 연결
              tracesToLogs:
                datasourceUid: loki # 로그를 어디서 조회할지 (Loki)
                filterByTraceID: true # trace_id로 로그 필터링
                filterBySpanID: false # span_id로는 필터 안 함
                mapTagNamesEnabled: false # 태그 이름 매핑 사용 안 함
                tags:
                  - compose_service # 로그 검색 시 사용될 태그
            readOnly: false
            editable: true
          - uid: loki
            orgId: 1
            name: Loki
            type: loki
            typeName: Loki
            access: proxy
            url: http://loki:3100
            password: ""
            user: ""
            database: ""
            basicAuth: false
            isDefault: false
            jsonData:
              derivedFields:
                # Logs → Traces 연동을 위한 Grafana용 "로그 파싱 + 링크 생성 규칙"
                # 로그 메시지 중에서 trace_id=abc123과 같은 패턴을 찾고
                # 해당 trace ID를 Tempo에 전달해서
                # 해당 로그와 연결된 trace를 클릭 한 번으로 바로 조회할 수 있게 만들어 줍
                - datasourceUid: tempo # Trace를 조회할 대상 (Tempo)
                  matcherRegex: (?:trace_id)=(\w+) # 로그에서 trace_id 추출할 정규표현식
                  name: TraceID # 필드 이름
                  url: $${__value.raw} # Tempo에서 이 값을 trace_id로 사용
            readOnly: false
            editable: true
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: "default"
            orgId: 1
            folder: ""
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/default
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        folder: /var/lib/grafana/dashboards/default
      datasources:
        enabled: false
    adminPassword: admin
  promtail:
    enabled: true
    fullnameOverride: promtail
    configmap:
      enabled: true
    config:
      clients:
        - url: http://loki:3100/loki/api/v1/push
          batchwait: 2s
          batchsize: 1048576
      snippets:
        pipelineStages:
          - cri: {}
          - multiline:
              firstline: '^\d{4}-\d{2}-\d{2} \d{1,2}:\d{2}:\d{2}'
              max_wait_time: 3s
          - regex:
              expression: '^(?P<time>\d{4}-\d{2}-\d{2} \d{1,2}:\d{2}:\d{2},\d{3}) .*trace_id=(?P<trace_id>[a-fA-F0-9]+) .*resource\.service\.name=(?P<compose_service>[^\]]+)] .* (?P<message>(?s:.*))$$'
          - labels:
              trace_id:
              compose_service:
  loki:
    enabled: true
    fullnameOverride: loki
    image:
      tag: 2.9.8
    service:
      type: NodePort
    config:
      limits_config:
        ingestion_rate_mb: 10
        ingestion_burst_size_mb: 20
    extraArgs:
      config.expand-env: true
    server:
      grpc_server_max_recv_msg_size: 8388608
      grpc_server_max_send_msg_size: 8388608

# https://grafana.github.io/helm-charts
tempo:
  enabled: true
  fullnameOverride: tempo
  service:
    type: NodePort

# https://artifacthub.io/packages/helm/bitnami/postgresql
postgresql:
  fullnameOverride: postgresql
  auth:
    postgresPassword: postgres
    username: postgres
    password: postgres
    database: persoliveadmin
  primary:
    service:
      type: NodePort
      nodePorts:
        postgresql: "30432"
    persistence:
      enabled: true
      size: 5Gi
    resources:
      requests:
        cpu: 2000m                   # 4 vCPU의 50%
        ephemeral-storage: 2Gi
        memory: 8Gi                  # 16 GiB의 50%
      limits:
        cpu: 4000m                   # 4 vCPU (Standard_D4ds_v5)
        ephemeral-storage: 4Gi
        memory: 16Gi                 # 16 GiB (Standard_D4ds_v5)
    
    extendedConfiguration: |
      # === 메모리 설정 (리소스 제약 환경) ===
      shared_buffers = 524288               # 4GB → 512MB (메모리 제약)
      
      # effective_cache_size: 사용 가능한 메모리의 75%
      effective_cache_size = 1572864           # 12GB → 3GB (4GB * 0.75)
      
      # work_mem: 연결당 작업 메모리 (낮춰서 경쟁 유발)
      work_mem = 4096                       # 64MB → 4MB (메모리 부족 유발)
      
      # maintenance_work_mem: 유지보수 작업용 메모리
      maintenance_work_mem = 274432          # 512MB → 64MB
      
      # === 연결 및 프로세스 설정 ===
      max_connections = 1000                       # 더 많은 CPU로 더 많은 연결 처리
      
      # === 쿼리 타임아웃 설정 (Azure 동일) ===
      statement_timeout = 0                       # 0 = 무제한 (Azure 기본값)
      lock_timeout = 0                            # 0 = 무제한 (Azure 기본값)
      deadlock_timeout = 1000                     # 1초 - 데드락 감지 시간
      idle_in_transaction_session_timeout = 0     # 0 = 무제한 (Azure 기본값)
      
      # === CPU 관련 설정 (Standard_D4ds_v5: 4 vCPU) ===
      # 병렬 처리 워커 수
      max_parallel_workers_per_gather = 2         # vCPU의 50%
      max_parallel_workers = 4                    # vCPU와 동일
      max_worker_processes = 4                    # vCPU와 동일
      
      # 병렬 유지보수 작업
      max_parallel_maintenance_workers = 2        # vCPU의 50%
      
      # === I/O 성능 설정 (Standard_D4ds_v5: 150 GiB Temp SSD) ===
      # Premium SSD 환경 최적화
      random_page_cost = 1.1                      # SSD 기준
      effective_io_concurrency = 200              # SSD 동시 I/O
      maintenance_io_concurrency = 10             # 유지보수 작업 I/O
      
      # === WAL 및 체크포인트 설정 ===
      wal_buffers = 16MB                          # shared_buffers의 3%
      checkpoint_completion_target = 0.9
      max_wal_size = 2GB
      min_wal_size = 512MB
      
      # === 쿼리 플래너 설정 ===
      default_statistics_target = 100
      
      # === 백그라운드 작업 설정 ===
      bgwriter_delay = 200ms
      bgwriter_lru_maxpages = 100
      bgwriter_lru_multiplier = 2.0
      
      # === Huge Pages 설정 ===
      huge_pages = try                            # Huge Pages 사용 시도
      
      # === 추가 성능 최적화 ===
      # JIT 컴파일 (복잡한 쿼리 성능 향상)
      jit = on
      jit_above_cost = 100000
      jit_optimize_above_cost = 500000
      
      # 통계 수집 최적화
      track_io_timing = on                        # I/O 시간 추적
      
      # === 로깅 (성능 모니터링) ===
      log_min_duration_statement = 1000           # 1초 이상 쿼리 로깅
      log_checkpoints = on
      log_lock_waits = on
      log_temp_files = 10MB

# pgBouncer 설정 (Azure 동일 설정)
pgbouncer:
  enabled: true  # pgBouncer 활성화
  replicas: 1
  
  image:
    repository: edoburu/pgbouncer
    tag: "1.21.0-p0"
    pullPolicy: IfNotPresent
  
  # 연결 풀링 설정 (Azure 설정과 동일)
  poolMode: transaction              # Azure: TRANSACTION
  defaultPoolSize: 100               # Azure: 100 (서버 연결 수)
  minPoolSize: 0                     # Azure: 0
  reservePoolSize: 5                 # 예비 연결
  maxClientConn: 10000               # Azure: 10000 (최대 클라이언트 연결)
  maxPreparedStatements: 0           # Azure: 0
  
  # 타임아웃 설정 (Azure 설정과 동일)
  queryWaitTimeout: 120              # Azure: 120초 - 연결 대기 시간
  serverIdleTimeout: 600             # Azure: 600초 - DB 연결 idle 시간
  serverLifetime: 3600               # 1시간 - DB 연결 최대 수명
  serverConnectTimeout: 15           # 15초 - 연결 시도 시간
  
  # 로깅
  logConnections: 1
  logDisconnections: 1
  logPoolerErrors: 1
  
  # 기타 설정
  ignoreStartupParameters: ""        # Azure: empty (관리자가 처리할 파라미터)
  statsUsers: ""                     # Azure: empty (pgBouncer 콘솔 접근 사용자)
  
  # Service 설정
  service:
    type: NodePort                   # ClusterIP 또는 NodePort
    nodePort: 30433                  # NodePort 사용 시
  
  # 리소스
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

nvidia:
  enabled: true
  image:
